AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Intentify - presign upload URL API

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10

Parameters:
  IntentRecordsTableName:
    Type: String
    Default: Intentify-IntentRecords

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,DELETE'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  IntentRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref IntentRecordsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presign/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        PresignRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /presign
            Method: POST

  PresignGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presignGet/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        PresignGetRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /presign-get
            Method: GET

  RecordingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: recordings/
      Handler: handler.handler
      Environment:
        Variables:
          INTENT_RECORDS_TABLE: !Ref IntentRecordsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt IntentRecordsTable.Arn
      Events:
        CreateRecordingRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recordings
            Method: POST

        ListRecordingsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recordings
            Method: GET

  IntentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: intents/
      Handler: handler.handler
      Environment:
        Variables:
          INTENT_RECORDS_TABLE: !Ref IntentRecordsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt IntentRecordsTable.Arn
      Events:
        ListIntentsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: GET
        CreateIntentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: POST
        DeleteIntentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: DELETE

  SpeakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: speak/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        SpeakRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /speak
            Method: POST

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"

  IntentRecordsTableName:
    Description: DynamoDB table for intent recording metadata
    Value: !Ref IntentRecordsTable
