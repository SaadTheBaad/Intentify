AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Intentify - API (presign, recordings, intents, transcribe (OpenAI), match (OpenAI), speak (AWS Polly))

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30

Parameters:
  IntentRecordsTableName:
    Type: String
    Default: Intentify-IntentRecords

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key (keep secret)

  OpenAISttModel:
    Type: String
    Default: gpt-4o-mini-transcribe

  OpenAIEmbedModel:
    Type: String
    Default: text-embedding-3-small

  OpenAIGptModel:
    Type: String
    Default: gpt-4o-mini

  SuggestIntentSystemPrompt:
    Type: String
    Default: "You are a helpful assistant that generates clear, concise intent phrases from user transcripts. Respond only with the intent phrase."

  SuggestIntentUserPromptTemplate:
    Type: String
    Default: |
      Given the following user speech transcript, suggest a clear and concise intent phrase that captures what the user wants to communicate or accomplish. The intent should be in first person and be suitable for quick selection in the future.

      Transcript: "{transcript}"

      Provide only the intent phrase, nothing else. Keep it under 100 characters. Make it natural and conversational.

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: NONE
        AddDefaultAuthorizerToCorsPreflight: false

  IntentRecordsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref IntentRecordsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # --------------------
  # Presign PUT (upload)
  # --------------------
  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presign/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        PresignRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /presign
            Method: POST

  # --------------------
  # Presign GET (playback)
  # --------------------
  PresignGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presignGet/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        PresignGetRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /presign-get
            Method: GET

  # --------------------
  # Recordings (POST + GET)
  # --------------------
  RecordingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: recordings/
      Handler: handler.handler
      Environment:
        Variables:
          INTENT_RECORDS_TABLE: !Ref IntentRecordsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt IntentRecordsTable.Arn
      Events:
        CreateRecordingRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recordings
            Method: POST

        ListRecordingsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recordings
            Method: GET

  # --------------------
  # Intents (POST + GET + DELETE) + store embedding (OpenAI)
  # --------------------
  IntentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: intents/
      Handler: handler.handler
      Environment:
        Variables:
          INTENT_RECORDS_TABLE: !Ref IntentRecordsTable
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_EMBED_MODEL: !Ref OpenAIEmbedModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt IntentRecordsTable.Arn
      Events:
        ListIntentsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: GET

        CreateIntentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: POST

        DeleteIntentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /intents
            Method: DELETE

  # --------------------
  # Transcribe (OpenAI)
  # --------------------
  OpenAITranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: transcribeOpenAI/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_STT_MODEL: !Ref OpenAISttModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        TranscribeRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /transcribe
            Method: POST

  # --------------------
  # AI Match (OpenAI embeddings + cosine)
  # --------------------
  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: match/
      Handler: handler.handler
      Environment:
        Variables:
          INTENT_RECORDS_TABLE: !Ref IntentRecordsTable
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_EMBED_MODEL: !Ref OpenAIEmbedModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt IntentRecordsTable.Arn
      Events:
        MatchRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /match
            Method: POST

  # --------------------
  # AI Suggest Intent (OpenAI GPT)
  # --------------------
  SuggestIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: suggestIntent/
      Handler: handler.handler
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_GPT_MODEL: !Ref OpenAIGptModel
          SYSTEM_PROMPT: !Ref SuggestIntentSystemPrompt
          USER_PROMPT_TEMPLATE: !Ref SuggestIntentUserPromptTemplate
      Events:
        SuggestIntentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /suggest-intent
            Method: POST

  # --------------------
  # Speak (AWS Polly) - POST /speak
  # --------------------
  SpeakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: speak/
      Handler: handler.handler
      Environment:
        Variables:
          BUCKET_NAME: intentbridge-audio-2026
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: arn:aws:s3:::intentbridge-audio-2026/*
      Events:
        SpeakRoute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /speak
            Method: POST

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"

  IntentRecordsTableName:
    Description: DynamoDB table for intent + recordings metadata
    Value: !Ref IntentRecordsTable
